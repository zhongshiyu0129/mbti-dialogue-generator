<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 对话图生成器 v4</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 1600px; margin: 0 auto; }
h1 { color: #fff; text-align: center; margin-bottom: 4px; font-size: 24px; }
.subtitle { color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 16px; font-size: 13px; }
.main { display: flex; gap: 16px; align-items: flex-start; }

.panel { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
.control-panel { flex: 0 0 500px; max-height: calc(100vh - 100px); overflow-y: auto; }
.preview-panel { flex: 1; min-height: 700px; display: flex; flex-direction: column; }

.section { margin-bottom: 18px; }
.section-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.section-title .tag { font-size: 10px; padding: 2px 7px; border-radius: 8px; font-weight: 500; }
.tag-a { background: #e3f2fd; color: #1976d2; }
.tag-b { background: #e8f5e9; color: #388e3c; }

/* MBTI 选择器 */
.mbti-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mbti-item { border: 2px solid #e0e0e0; border-radius: 8px; padding: 4px; cursor: pointer; transition: all 0.2s; text-align: center; background: #fafafa; }
.mbti-item:hover { border-color: #9c27b0; background: #f3e5f5; }
.mbti-item.selected { border-color: #7c4dff; background: #ede7f6; box-shadow: 0 2px 6px rgba(124, 77, 255, 0.3); }
.mbti-item img { width: 100%; height: 42px; object-fit: contain; }
.mbti-item .code { font-size: 10px; font-weight: 600; color: #333; }

/* 对话输入 */
.dialogue-list { display: flex; flex-direction: column; gap: 8px; }
.dialogue-item { display: flex; gap: 6px; align-items: flex-start; }
.speaker-btn { flex: 0 0 32px; height: 34px; border-radius: 7px; border: none; cursor: pointer; font-weight: 700; font-size: 12px; transition: all 0.2s; }
.speaker-a { background: #e3f2fd; color: #1976d2; }
.speaker-b { background: #e8f5e9; color: #388e3c; }
.dialogue-text { flex: 1; padding: 8px 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 13px; resize: vertical; min-height: 34px; font-family: inherit; }
.dialogue-text:focus { outline: none; border-color: #7c4dff; box-shadow: 0 0 0 2px rgba(124, 77, 255, 0.1); }
.delete-btn { flex: 0 0 28px; height: 34px; border: none; background: #ffebee; color: #e53935; border-radius: 7px; cursor: pointer; font-size: 14px; }
.delete-btn:hover { background: #ffcdd2; }
.split-btn { flex: 0 0 28px; height: 34px; border: none; background: #e3f2fd; color: #1976d2; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 700; }
.split-btn:hover { background: #bbdefb; }
.page-divider { text-align: center; padding: 6px 0; position: relative; }
.page-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: dashed #ccc; }
.page-divider span { background: #fff; padding: 0 10px; position: relative; font-size: 10px; color: #999; }
.add-btn { width: 100%; padding: 8px; border: 2px dashed #ccc; background: #fafafa; border-radius: 7px; cursor: pointer; font-size: 13px; color: #666; }
.add-btn:hover { border-color: #7c4dff; color: #7c4dff; background: #f3e5f5; }

/* AI辅助按钮 */
.ai-assist-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
.ai-assist-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4); }
.ai-assist-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* 输入框通用 */
.text-input { width: 100%; padding: 9px 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; }
.text-input:focus { outline: none; border-color: #7c4dff; box-shadow: 0 0 0 2px rgba(124, 77, 255, 0.1); }
.hint { font-size: 11px; color: #999; margin-top: 5px; line-height: 1.4; }

/* 风格指令字段 */
.style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.style-field { display: flex; flex-direction: column; gap: 4px; }
.style-field.full { grid-column: 1 / -1; }
.style-field label { font-size: 12px; color: #666; font-weight: 500; }
.style-field input { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; font-family: inherit; }
.style-field input:focus { outline: none; border-color: #7c4dff; box-shadow: 0 0 0 2px rgba(124, 77, 255, 0.1); }

/* 页面管理 */
.page-manager { border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; }
.page-card { border-bottom: 1px solid #e0e0e0; }
.page-card:last-child { border-bottom: none; }
.page-card-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #fafafa; cursor: pointer; transition: background 0.2s; }
.page-card-header:hover { background: #f3e5f5; }
.page-card-title { font-size: 13px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; }
.page-card-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #7c4dff; color: #fff; }
.page-card-badge.generated { background: #4caf50; }
.page-card-badge.generating { background: #ff9800; }
.page-card-actions { display: flex; gap: 4px; }
.page-card-btn { padding: 4px 8px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 500; }
.page-card-btn.generate { background: #7c4dff; color: #fff; }
.page-card-btn.generate:hover { background: #651fff; }
.page-card-btn.generate:disabled { opacity: 0.5; cursor: not-allowed; }
.page-card-btn.delete { background: #ffebee; color: #e53935; }
.page-card-btn.delete:hover { background: #ffcdd2; }
.page-card-body { padding: 12px; display: none; }
.page-card.expanded .page-card-body { display: block; }

/* 对话选择 */
.dialogue-select-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dialogue-chip { padding: 4px 10px; border: 1px solid #ddd; border-radius: 12px; font-size: 11px; cursor: pointer; background: #fafafa; transition: all 0.2s; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dialogue-chip:hover { border-color: #7c4dff; }
.dialogue-chip.selected { background: #ede7f6; border-color: #7c4dff; color: #7c4dff; font-weight: 600; }

/* 进度条 */
.page-progress { margin-top: 8px; }
.progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #7c4dff, #536dfe); transition: width 0.3s; width: 0%; }
.progress-text { font-size: 11px; color: #666; margin-top: 4px; }

/* 生成按钮 */
.generate-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #7c4dff 0%, #536dfe 100%); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(124, 77, 255, 0.4); }
.generate-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124, 77, 255, 0.5); }
.generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; }
.btn-row .generate-btn { flex: 1; padding: 10px; font-size: 13px; }
.btn-secondary { background: #fff; color: #7c4dff; border: 2px solid #7c4dff; box-shadow: none; }
.btn-secondary:hover:not(:disabled) { background: #f3e5f5; }
.btn-clear { background: #fff; color: #f44336; border: 2px solid #f44336; box-shadow: none; }
.btn-clear:hover:not(:disabled) { background: #ffebee; }
.btn-save { background: linear-gradient(135deg, #4caf50 0%, #43a047 100%); }
.stop-btn { width: 100%; margin-top: 8px; padding: 10px; background: #f44336; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: none; transition: all 0.2s; }
.stop-btn:hover { background: #e53935; transform: translateY(-1px); }
.stop-btn.show { display: block; }

/* 预览区 - 页码导航 */
.page-nav { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
.page-tab { padding: 6px 14px; border: 2px solid #ddd; background: #fafafa; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; transition: all 0.2s; }
.page-tab:hover { border-color: #7c4dff; color: #7c4dff; }
.page-tab.active { background: #7c4dff; color: #fff; border-color: #7c4dff; }
.page-tab.generated { border-color: #4caf50; color: #4caf50; }
.page-tab.active.generated { background: #4caf50; color: #fff; border-color: #4caf50; }
.page-tab.generating { border-color: #ff9800; color: #ff9800; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Canvas 预览 */
.preview-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 400px; }
#previewCanvas { max-width: 100%; max-height: 65vh; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.2); display: none; }
.preview-placeholder { text-align: center; color: #999; }
.preview-placeholder .icon { font-size: 56px; margin-bottom: 12px; opacity: 0.3; }
.preview-placeholder .text { font-size: 14px; line-height: 1.6; }

/* 加载状态 */
.loading { text-align: center; color: #666; display: none; }
.loading .spinner { width: 36px; height: 36px; border: 4px solid #e0e0e0; border-top-color: #7c4dff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading .text { font-size: 13px; line-height: 1.6; }

/* 修改区域 */
.modify-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; display: none; }
.modify-section.show { display: block; }
.modify-input { width: 100%; padding: 9px 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 60px; margin-bottom: 8px; }
.modify-input:focus { outline: none; border-color: #ff9800; box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.1); }
.modify-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.modify-btn:hover:not(:disabled) { transform: translateY(-1px); }
.modify-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* 气泡调整面板 */
.bubble-adjust-panel { padding: 14px; background: linear-gradient(135deg, #f5f3ff 0%, #f0f9ff 100%); border-radius: 12px; margin-top: 12px; border: 1px solid #e0e7ff; }
.adjust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
.adjust-item label { display: block; font-size: 11px; color: #555; margin-bottom: 4px; font-weight: 500; }
.adjust-item label span { color: #6366f1; font-weight: 600; }
.adjust-item input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: #e0e7ff; border-radius: 2px; outline: none; }
.adjust-item input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #6366f1; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 4px rgba(99,102,241,0.3); }
.reset-bubble-btn { width: 100%; padding: 7px; border: 1px solid #c7d2fe; background: #fff; color: #6366f1; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; }
.reset-bubble-btn:hover { background: #eef2ff; }

/* 下载按钮 */
.download-row { display: flex; gap: 8px; margin-top: 12px; }
.download-btn { flex: 1; padding: 9px; background: #4caf50; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; transition: all 0.2s; }
.download-btn:hover { background: #43a047; }
.download-btn.show { display: block; }

/* 历史记录 */
.history-list { max-height: 200px; overflow-y: auto; margin-top: 8px; }
.history-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 6px; background: #fafafa; transition: all 0.2s; }
.history-item:hover { border-color: #7c4dff; background: #f3e5f5; }
.history-info { flex: 1; min-width: 0; cursor: pointer; }
.history-name { font-size: 12px; font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-meta { font-size: 10px; color: #999; margin-top: 2px; }
.history-actions { display: flex; gap: 4px; margin-left: 8px; }
.history-load-btn { padding: 4px 8px; background: #7c4dff; color: #fff; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; }
.history-load-btn:hover { background: #651fff; }
.history-delete-btn { padding: 4px 8px; background: #ffebee; color: #e53935; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; }
.history-delete-btn:hover { background: #ffcdd2; }

/* 响应式 */
@media (max-width: 900px) {
  .main { flex-direction: column; }
  .control-panel { flex: none; width: 100%; max-height: none; }
  .style-grid { grid-template-columns: 1fr; }
}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="container">
  <!-- API Key 横幅 -->
  <div id="apiKeyBanner" style="display:none; background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 16px; margin-bottom: 16px; text-align: center;">
    <h3 style="margin: 0 0 10px 0; color: #856404; font-size: 16px;">🔑 请先配置 API Key</h3>
    <p style="margin: 0 0 12px 0; color: #856404; font-size: 13px;">首次使用需要填入火山方舟 Seedream API Key，保存后浏览器会记住。</p>
    <div style="display: flex; gap: 8px; max-width: 500px; margin: 0 auto;">
      <input type="password" id="apiKeyInput" placeholder="ark-xxxxxxxxxxxxxxxx" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;">
      <button onclick="saveApiKeyFromInput()" style="padding: 10px 20px; background: #ffc107; color: #000; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;">保存 Key</button>
    </div>
  </div>
  
  <h1>MBTI 对话图生成器 v4</h1>
  <p class="subtitle">手动分页 · 每页独立设定 · 真实生成进度 · AI辅助切页 · 背景全图延伸</p>
  
  <div class="main">
    <!-- 左侧控制面板 -->
    <div class="panel control-panel">
      <!-- 人物A -->
      <div class="section">
        <div class="section-title">人物 A <span class="tag tag-a">左侧</span></div>
        <div class="mbti-grid" id="mbtiGridA"></div>
      </div>
      
      <!-- 人物B -->
      <div class="section">
        <div class="section-title">人物 B <span class="tag tag-b">右侧</span></div>
        <div class="mbti-grid" id="mbtiGridB"></div>
      </div>
      
      <!-- 对话内容 -->
      <div class="section">
        <div class="section-title">对话内容</div>
        <div class="dialogue-list" id="dialogueList"></div>
        <button class="add-btn" onclick="addDialogue()">+ 添加一条对话</button>
        <button class="ai-assist-btn" id="aiAssistBtn" onclick="aiAssist()">🤖 AI 辅助切页和设定画面</button>
      </div>
      
      <!-- 全局风格 -->
      <div class="section">
        <div class="section-title">全局风格设定 <span style="font-size:11px;color:#999;font-weight:normal;">（应用到所有页）</span></div>
        <div class="style-grid">
          <div class="style-field full">
            <label>🎨 整体风格</label>
            <input type="text" id="globalOverall" placeholder="搞笑 / 温馨 / 赛博朋克 / 复古 / 治愈系...">
          </div>
          <div class="style-field full">
            <label>🏠 统一场景背景</label>
            <input type="text" id="globalScene" placeholder="咖啡馆 / 办公室 / 户外公园 / 家里客厅...（不填则每页独立）">
          </div>
        </div>
      </div>
      
      <!-- 页面管理 -->
      <div class="section">
        <div class="section-title">页面管理 <span style="font-size:11px;color:#999;font-weight:normal;">（点击展开设置）</span></div>
        <div class="page-manager" id="pageManager"></div>
        <button class="add-btn" style="margin-top:8px;" onclick="addPage()">+ 添加一页</button>
      </div>
      
      <!-- 操作按钮 -->
      <div class="btn-row">
        <button class="generate-btn" id="generateAllBtn" onclick="generateAll()">生成全部</button>
        <button class="generate-btn btn-save" onclick="saveCurrentSettings()">💾 保存</button>
        <button class="generate-btn btn-clear" onclick="clearAllSettings()">🗑 清除</button>
      </div>
      <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">⏹ 停止生成</button>
      
      <!-- 历史记录 -->
      <div class="section" style="margin-top:18px;">
        <div class="section-title">历史记录</div>
        <div class="history-list" id="historyList">
          <p class="hint" style="text-align:center;margin:10px 0;">暂无保存的记录</p>
        </div>
      </div>
    </div>
    
    <!-- 右侧预览区 -->
    <div class="panel preview-panel">
      <!-- 页码导航 -->
      <div class="page-nav" id="pageNav"></div>
      
      <!-- Canvas 预览 -->
      <div class="preview-canvas-wrap">
        <div class="preview-placeholder" id="placeholder">
          <div class="icon">🎨</div>
          <div class="text">选择 MBTI、输入对话、设置页面后<br>点击「生成全部」或单页的「生成」按钮</div>
        </div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div class="text" id="loadingText">AI 正在生成中...</div>
        </div>
        <canvas id="previewCanvas" width="1920" height="2560"></canvas>
      </div>
      
      <!-- 气泡调整面板 -->
      <div class="bubble-adjust-panel" id="bubbleAdjustPanel" style="display:none;">
        <div class="section-title" style="margin-bottom:10px;font-size:13px;">🎨 气泡调整（实时预览）</div>
        <div class="adjust-grid">
          <div class="adjust-item">
            <label>字体大小 <span id="fontSizeVal">52px</span></label>
            <input type="range" min="30" max="80" value="52" oninput="updateBubbleSetting('fontSize', this.value)">
          </div>
          <div class="adjust-item">
            <label>气泡宽度 <span id="maxWidthVal">75%</span></label>
            <input type="range" min="50" max="90" value="75" oninput="updateBubbleSetting('maxWidth', this.value)">
          </div>
          <div class="adjust-item">
            <label>垂直位置 <span id="verticalPosVal">56%</span></label>
            <input type="range" min="40" max="75" value="56" oninput="updateBubbleSetting('verticalPos', this.value)">
          </div>
          <div class="adjust-item">
            <label>不透明度 <span id="opacityVal">95%</span></label>
            <input type="range" min="70" max="100" value="95" oninput="updateBubbleSetting('opacity', this.value / 100)">
          </div>
        </div>
        <button class="reset-bubble-btn" onclick="resetBubbleSettings()">↺ 恢复默认</button>
      </div>
      
      <!-- 修改区域 -->
      <div class="modify-section" id="modifySection">
        <div class="section-title" style="margin-bottom:8px;">修改这张图</div>
        <textarea class="modify-input" id="modifyInput" rows="2" placeholder="输入修改指令，例如：把背景改成咖啡馆，让INTJ笑一下"></textarea>
        <button class="modify-btn" id="modifyBtn" onclick="modifyCurrentPage()">基于这张图修改</button>
      </div>
      
      <!-- 下载按钮 -->
      <div class="download-row">
        <button class="download-btn" id="downloadCurrentBtn" onclick="downloadCurrentPage()">下载当前页</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============ 配置 ============
const API_KEY_STORAGE_KEY = 'mbti_dialogue_api_key';
const HISTORY_STORAGE_KEY = 'mbti_dialogue_history_v4';
const SEEDREAM_MODEL_ID = 'doubao-seedream-4-5-251128';
const SEEDREAM_API_URL = 'https://ark.cn-beijing.volces.com/api/v3/images/generations';
const CANVAS_W = 1920;
const CANVAS_H = 2560;

// ============ API Key 管理 ============
function getApiKey() {
  const saved = localStorage.getItem(API_KEY_STORAGE_KEY);
  if (saved && saved.trim()) return saved.trim();
  if (window.CONFIG && window.CONFIG.API_KEY && window.CONFIG.API_KEY.trim()) return window.CONFIG.API_KEY.trim();
  return '';
}
function saveApiKey(key) {
  if (key && key.trim()) localStorage.setItem(API_KEY_STORAGE_KEY, key.trim());
  else localStorage.removeItem(API_KEY_STORAGE_KEY);
}
function showApiKeyBanner() {
  const banner = document.getElementById('apiKeyBanner');
  if (!getApiKey()) banner.style.display = 'block';
  else banner.style.display = 'none';
}
function saveApiKeyFromInput() {
  const input = document.getElementById('apiKeyInput');
  const key = input.value.trim();
  if (!key) { alert('请输入 API Key'); return; }
  saveApiKey(key);

function renderDialogues() {
  const list = document.getElementById('dialogueList');
  list.innerHTML = '';
  
  // 计算每条对话属于哪一页
  const dialoguePageMap = {};
  pages.forEach((page, pi) => {
    page.dialogueIds.forEach(id => { dialoguePageMap[id] = pi; });
  });
  
  allDialogues.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'dialogue-item';
    const pageNum = dialoguePageMap[i] !== undefined ? dialoguePageMap[i] + 1 : '?';
    item.innerHTML = `
      <button class="speaker-btn ${d.speaker === 'a' ? 'speaker-a' : 'speaker-b'}" onclick="toggleSpeaker(${i})" title="切换说话人">${d.speaker.toUpperCase()}</button>
      <textarea class="dialogue-text" rows="1" oninput="updateDialogue(${i}, this.value)" placeholder="输入对话内容...">${d.text}</textarea>
      <button class="split-btn" onclick="splitAfterDialogue(${i})" title="在此处分页">↵</button>
      <button class="delete-btn" onclick="deleteDialogue(${i})">×</button>
    `;
    list.appendChild(item);
    
    // 如果下一条对话属于不同页，显示分页符
    if (i < allDialogues.length - 1 && dialoguePageMap[i] !== undefined && dialoguePageMap[i+1] !== undefined && dialoguePageMap[i] !== dialoguePageMap[i+1]) {
      const divider = document.createElement('div');
      divider.className = 'page-divider';
      divider.innerHTML = `<span>—— 第 ${dialoguePageMap[i]+1} 页结束 ——</span>`;
      list.appendChild(divider);
    }
  });
}
function toggleSpeaker(i) { allDialogues[i].speaker = allDialogues[i].speaker === 'a' ? 'b' : 'a'; renderDialogues(); }
function updateDialogue(i, text) { allDialogues[i].text = text; }

// 在第 i 条对话后分页
function splitAfterDialogue(i) {
  if (i >= allDialogues.length - 1) return;
  
  // 找到包含第 i 条对话的页面
  const pageIndex = pages.findIndex(p => p.dialogueIds.includes(i));
  if (pageIndex === -1) return;
  
  const page = pages[pageIndex];
  const idxInPage = page.dialogueIds.indexOf(i);
  
  // 该页中 i 之后的对话
  const afterIds = page.dialogueIds.slice(idxInPage + 1);
  
  if (afterIds.length === 0) return;
  
  // 从当前页移除
  page.dialogueIds = page.dialogueIds.slice(0, idxInPage + 1);
  
  // 新建一页，包含之后的对话
  const newPage = {
    id: Date.now(),
    dialogueIds: afterIds,
    style: { scene: '', actionA: '', actionB: '', extra: '' },
    characterImageUrl: null,
    generated: false,
    generating: false,
    progress: 0,
    progressText: ''
  };
  
  // 插入到当前页之后
  pages.splice(pageIndex + 1, 0, newPage);
  
  // 把后续页面中也包含这些对话的移除（避免重复）
  for (let j = pageIndex + 2; j < pages.length; j++) {
    pages[j].dialogueIds = pages[j].dialogueIds.filter(id => !afterIds.includes(id));
  }
  
  renderDialogues();
  renderPageManager();
  renderPageNav();
}
function deleteDialogue(i) {
  if (allDialogues.length <= 1) return;
  allDialogues.splice(i, 1);
  renderDialogues();
  // 从所有页面中移除该对话索引
  pages.forEach(p => { p.dialogueIds = p.dialogueIds.filter(id => id !== i); });
  // 调整大于i的索引
  pages.forEach(p => { p.dialogueIds = p.dialogueIds.map(id => id > i ? id - 1 : id); });
  renderPageManager();
  renderPageNav();
}
function addDialogue() {
  const lastSpeaker = allDialogues[allDialogues.length - 1].speaker;
  allDialogues.push({ speaker: lastSpeaker === 'a' ? 'b' : 'a', text: '' });
  renderDialogues();
}

// ============ 加载图片 ============
async function loadImage(src) {
  if (characterImages[src]) return characterImages[src];
  if (src.startsWith('http://') || src.startsWith('https://')) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { characterImages[src] = img; resolve(img); };
      img.onerror = () => reject(new Error(`远程图片加载失败`));
      img.src = src;
    });
  }
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { characterImages[src] = img; resolve(img); };
    img.onerror = () => reject(new Error(`本地图片加载失败: ${src}`));
    img.src = src;
  });
}

// ============ 拼接参考图 ============
async function createReferenceImage() {
  const REF_W = 768;
  const REF_H = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = REF_W;
  canvas.height = REF_H;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, REF_W, REF_H);
  
  const [imgA, imgB] = await Promise.all([
    loadImage(`assets/${selectedA}.png`),
    loadImage(`assets/${selectedB}.png`),
  ]);
  
  const size = 320;
  const y = 80;
  ctx.drawImage(imgA, 48, y, size, size);
  
  ctx.save();
  ctx.translate(REF_W - 48 - size, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(imgB, 0, y, size, size);
  ctx.restore();
  
  return canvas.toDataURL('image/jpeg', 0.8);
}

// ============ 调用 Seedream API ============
async function callSeedreamImageEdit(referenceImage, prompt, onProgress) {
  currentAbortController = new AbortController();
  try {
    if (onProgress) onProgress(20, '正在调用 AI 生成...');
    const response = await fetch(SEEDREAM_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getApiKey()}` },
      body: JSON.stringify({ model: SEEDREAM_MODEL_ID, prompt: prompt, image: referenceImage, size: `${CANVAS_W}x${CANVAS_H}`, response_format: 'url' }),
      signal: currentAbortController.signal,
    });
    if (!response.ok) {
      const text = await response.text();
      throw new Error(`API 错误 (${response.status}): ${text.substring(0, 300)}`);
    }
    if (onProgress) onProgress(75, 'AI 生成完成，正在加载图片...');
    const data = await response.json();
    const imageUrl = data.data && data.data[0] && data.data[0].url;
    if (!imageUrl) throw new Error('API 返回数据格式异常: ' + JSON.stringify(data).substring(0, 300));
    return imageUrl;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('已停止生成');
    throw error;
  } finally {
    currentAbortController = null;
  }
}

// ============ 生成单页 ============
async function generateSinglePage(pageIndex) {
  if (!getApiKey()) { alert('请先配置 API Key'); showApiKeyBanner(); return; }
  const page = pages[pageIndex];
  if (!page || page.dialogueIds.length === 0) { alert('请先为这一页选择对话'); return; }
  
  shouldStop = false;
  page.generating = true;
  page.generated = false;
  page.progress = 0;
  page.progressText = '准备中...';
  currentPageIndex = pageIndex;
  
  renderPageManager();
  renderPageNav();
  showPage(pageIndex);
  
  try {
    // 阶段1：拼接参考图
    page.progress = 10;
    page.progressText = '正在拼接参考图...';
    renderPageManager();
    showPage(pageIndex);
    
    let referenceImage;
    const isFirstPage = (pageIndex === 0);
    if (isFirstPage || !pages[0].characterImageUrl) {
      referenceImage = await createReferenceImage();
    } else {
      referenceImage = pages[0].characterImageUrl;
    }
    
    if (shouldStop) throw new Error('已停止生成');
    
    // 阶段2：调用AI
    const prompt = generatePromptForPage(page, pageIndex, pages.length, isFirstPage);
    const imageUrl = await callSeedreamImageEdit(referenceImage, prompt, (p, t) => {
      page.progress = p;
      page.progressText = t;
      renderPageManager();
      showPage(pageIndex);
    });
    
    if (shouldStop) throw new Error('已停止生成');
    
    // 阶段3：加载图片
    page.progress = 85;
    page.progressText = '正在加载生成的图片...';
    renderPageManager();
    showPage(pageIndex);
    await loadImage(imageUrl);
    
    // 阶段4：合成
    page.progress = 95;
    page.progressText = '正在合成对话气泡...';
    renderPageManager();
    
    page.characterImageUrl = imageUrl;
    page.generated = true;
    page.generating = false;
    page.progress = 100;
    page.progressText = '生成完成';
    
    await renderCanvas(pageIndex);
    renderPageManager();
    renderPageNav();
    showPage(pageIndex);
    showBubbleAdjustPanel();
    
  } catch (error) {
    page.generating = false;
    page.progress = 0;
    page.progressText = '';
    renderPageManager();
    renderPageNav();
    showPage(pageIndex);
    if (error.message !== '已停止生成') {
      alert(`第 ${pageIndex + 1} 页生成失败：${error.message}`);
    }
  }
}

// ============ 生成全部 ============
async function generateAll() {
  if (!getApiKey()) { alert('请先配置 API Key'); showApiKeyBanner(); return; }
  
  const stopBtn = document.getElementById('stopBtn');
  const genBtn = document.getElementById('generateAllBtn');
  shouldStop = false;
  genBtn.disabled = true;
  stopBtn.classList.add('show');
  
  for (let i = 0; i < pages.length; i++) {
    if (shouldStop) break;
    if (pages[i].dialogueIds.length === 0) continue;
    await generateSinglePage(i);
  }
  
  genBtn.disabled = false;
  stopBtn.classList.remove('show');
}

// ============ 停止生成 ============
function stopGeneration() {
  shouldStop = true;
  if (currentAbortController) currentAbortController.abort();
  const stopBtn = document.getElementById('stopBtn');
  stopBtn.textContent = '⏳ 正在停止...';
  stopBtn.disabled = true;
  setTimeout(() => {
    stopBtn.textContent = '⏹ 停止生成';
    stopBtn.disabled = false;
  }, 1500);
}

// ============ Canvas 合成（背景全图延伸，气泡灵活布局）============
async function renderCanvas(pageIndex) {
  const page = pages[pageIndex];
  if (!page || !page.characterImageUrl) return;
  
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  
  const charImg = await loadImage(page.characterImageUrl);
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.drawImage(charImg, 0, 0, CANVAS_W, CANVAS_H);
  
  // 获取本页对话
  const pageDialogues = page.dialogueIds.map(id => allDialogues[id]).filter(d => d && d.text.trim());
  if (pageDialogues.length === 0) return;
  
  // 使用用户调整的气泡参数
  const n = pageDialogues.length;
  const baseFontSize = bubbleSettings.fontSize;
  const fontSize = n >= 5 ? Math.max(baseFontSize - 8, 28) : baseFontSize;
  const lineHeight = fontSize * 1.35;
  
  const bubbleAreaTop = CANVAS_H * (bubbleSettings.verticalPos / 100);
  const bubbleAreaBottom = CANVAS_H * 0.96;
  const bubbleAreaHeight = bubbleAreaBottom - bubbleAreaTop;
  
  const bubblePaddingX = 36;
  const bubblePaddingY = 26;
  const maxBubbleWidth = CANVAS_W * (bubbleSettings.maxWidth / 100);
  const gap = 20;
  
  // 计算每个气泡的高度
  const bubbles = pageDialogues.map(d => {
    const isA = d.speaker === 'a';
    const lines = wrapText(ctx, d.text, maxBubbleWidth - bubblePaddingX * 2, fontSize);
    const textHeight = lines.length * lineHeight;
    const bubbleHeight = textHeight + bubblePaddingY * 2 + 18;
    return { isA, text: d.text, lines, fontSize, lineHeight, bubblePaddingX, bubblePaddingY, bubbleHeight, opacity: bubbleSettings.opacity };
  });
  
  const totalHeight = bubbles.reduce((sum, b) => sum + b.bubbleHeight, 0) + (bubbles.length - 1) * gap;
  
  // 垂直居中
  let currentY = bubbleAreaTop + (bubbleAreaHeight - totalHeight) / 2;
  if (currentY < bubbleAreaTop) currentY = bubbleAreaTop;
  
  // 绘制每个气泡
  bubbles.forEach(bubble => {
    drawBubbleFlexible(ctx, bubble, currentY, maxBubbleWidth);
    currentY += bubble.bubbleHeight + gap;
  });
}

function wrapText(ctx, text, maxWidth, fontSize) {
  ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif`;
  const lines = [];
  let currentLine = '';
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const testLine = currentLine + char;
    if (ctx.measureText(testLine).width > maxWidth && currentLine !== '') {
      lines.push(currentLine);
      currentLine = char;
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine) lines.push(currentLine);
  return lines;
}

function drawBubbleFlexible(ctx, bubble, y, maxWidth) {
  const { isA, lines, fontSize, lineHeight, bubblePaddingX, bubblePaddingY, bubbleHeight } = bubble;
  
  const radius = 24;
  const triangleSize = 18;
  
  ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif`;
  let textWidth = 0;
  lines.forEach(line => { const w = ctx.measureText(line).width; if (w > textWidth) textWidth = w; });
  const bubbleWidth = Math.min(textWidth + bubblePaddingX * 2, maxWidth);
  
  let x;
  if (isA) x = 80;
  else x = CANVAS_W - 80 - bubbleWidth;
  
  const bubbleTop = y + triangleSize;
  const bubbleBottom = y + bubbleHeight;
  
  // 半透明白色背景
  const opacity = bubble.opacity || 0.95;
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 6;
  
  ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
  ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(opacity + 0.05, 1)})`;
  ctx.lineWidth = 2;
  
  ctx.beginPath();
  ctx.moveTo(x + radius, bubbleTop);
  ctx.lineTo(x + bubbleWidth - radius, bubbleTop);
  ctx.quadraticCurveTo(x + bubbleWidth, bubbleTop, x + bubbleWidth, bubbleTop + radius);
  ctx.lineTo(x + bubbleWidth, bubbleBottom - radius);
  ctx.quadraticCurveTo(x + bubbleWidth, bubbleBottom, x + bubbleWidth - radius, bubbleBottom);
  ctx.lineTo(x + radius, bubbleBottom);
  ctx.quadraticCurveTo(x, bubbleBottom, x, bubbleBottom - radius);
  ctx.lineTo(x, bubbleTop + radius);
  ctx.quadraticCurveTo(x, bubbleTop, x + radius, bubbleTop);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  
  // 三角
  ctx.save();
  ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
  const triangleY = bubbleTop + 20;
  ctx.beginPath();
  if (isA) {
    ctx.moveTo(x, triangleY);
    ctx.lineTo(x - triangleSize, triangleY + triangleSize / 2);
    ctx.lineTo(x, triangleY + triangleSize);
  } else {
    ctx.moveTo(x + bubbleWidth, triangleY);
    ctx.lineTo(x + bubbleWidth + triangleSize, triangleY + triangleSize / 2);
    ctx.lineTo(x + bubbleWidth, triangleY + triangleSize);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  
  // 文字
  ctx.fillStyle = '#222';
  ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif`;
  ctx.textBaseline = 'top';
  const textX = x + bubblePaddingX;
  let textY = bubbleTop + bubblePaddingY;
  lines.forEach(line => {
    ctx.fillText(line, textX, textY);
    textY += lineHeight;
  });
}

// ============ 修改当前页 ============
async function modifyCurrentPage() {
  const modifyInstruction = document.getElementById('modifyInput').value.trim();
  if (!modifyInstruction) { alert('请输入修改指令'); return; }
  const page = pages[currentPageIndex];
  if (!page || !page.characterImageUrl) { alert('当前页还没有生成图片'); return; }
  
  const btn = document.getElementById('modifyBtn');
  btn.disabled = true;
  
  try {
    const typeA = MBTI_TYPES.find(t => t.code === selectedA);
    const typeB = MBTI_TYPES.find(t => t.code === selectedB);
    const prompt = `基于这张 MBTI 人格对话漫画进行修改。

修改要求：${modifyInstruction}

保持要求：
1. 保持 ${typeA.name} 和 ${typeB.name} 两个角色的基本形象、颜色和低多边形风格不变
2. 正常的人体结构，每个角色只有两只手
3. 保持背景、场景、光照和整体氛围不变
4. 绝对不要添加任何对话气泡、文字或字幕
5. 只修改用户指定的部分，不要改变其他元素`;
    
    page.generating = true;
    renderPageManager();
    showPage(currentPageIndex);
    
    const newImageUrl = await callSeedreamImageEdit(page.characterImageUrl, prompt, (p, t) => {
      page.progress = p;
      page.progressText = t;
      renderPageManager();
      showPage(currentPageIndex);
    });
    
    delete characterImages[page.characterImageUrl];
    page.characterImageUrl = newImageUrl;
    page.generating = false;
    await loadImage(newImageUrl);
    await renderCanvas(currentPageIndex);
    renderPageManager();
    renderPageNav();
    showPage(currentPageIndex);
    document.getElementById('modifyInput').value = '';
    
  } catch (error) {
    page.generating = false;
    renderPageManager();
    showPage(currentPageIndex);
    alert(`修改失败：${error.message}`);
  } finally {
    btn.disabled = false;
  }
}

// ============ 气泡调整 ============
function updateBubbleSetting(key, value) {
  const val = parseFloat(value);
  bubbleSettings[key] = val;
  
  // 更新显示值
  const valMap = {
    fontSize: 'fontSizeVal',
    maxWidth: 'maxWidthVal',
    verticalPos: 'verticalPosVal',
    opacity: 'opacityVal'
  };
  if (valMap[key]) {
    const el = document.getElementById(valMap[key]);
    if (el) {
      if (key === 'opacity') el.textContent = Math.round(val * 100) + '%';
      else if (key === 'fontSize') el.textContent = val + 'px';
      else el.textContent = val + '%';
    }
  }
  
  // 实时重渲染
  if (pages[currentPageIndex] && pages[currentPageIndex].characterImageUrl) {
    renderCanvas(currentPageIndex);
  }
}

function resetBubbleSettings() {
  bubbleSettings = { fontSize: 52, maxWidth: 75, verticalPos: 56, opacity: 0.95 };
  // 重置滑块
  document.querySelector('input[oninput*="fontSize"]').value = 52;
  document.querySelector('input[oninput*="maxWidth"]').value = 75;
  document.querySelector('input[oninput*="verticalPos"]').value = 56;
  document.querySelector('input[oninput*="opacity"]').value = 95;
  // 更新显示
  document.getElementById('fontSizeVal').textContent = '52px';
  document.getElementById('maxWidthVal').textContent = '75%';
  document.getElementById('verticalPosVal').textContent = '56%';
  document.getElementById('opacityVal').textContent = '95%';
  // 重渲染
  if (pages[currentPageIndex] && pages[currentPageIndex].characterImageUrl) {
    renderCanvas(currentPageIndex);
  }
}

function showBubbleAdjustPanel() {
  const panel = document.getElementById('bubbleAdjustPanel');
  if (panel) panel.style.display = 'block';
}

// ============ 下载 ============
function downloadCurrentPage() {
  const canvas = document.getElementById('previewCanvas');
  try {
    const link = document.createElement('a');
    link.download = `MBTI对话图_第${currentPageIndex + 1}页.png`;

}

// ============ AI 辅助切页和设定 ============
async function aiAssist() {
  if (allDialogues.length === 0) { alert('请先输入对话内容'); return; }
  
  const btn = document.getElementById('aiAssistBtn');
  btn.disabled = true;
  btn.textContent = '🤖 AI 正在分析对话...';
  
  try {
    // 简单规则引擎：按情绪和话题自动切页
    const newPages = [];
    let currentPageDialogues = [];
    let lastMood = '';
    
    for (let i = 0; i < allDialogues.length; i++) {
      const d = allDialogues[i];
      const text = d.text;
      
      // 判断情绪
      let mood = 'neutral';
      if (/哈哈|开心|好呀|太棒|喜欢|哇|嘻嘻|好棒|太好了|走啦|吃|玩|耶|棒|爽|快乐|高兴|兴奋/.test(text)) mood = 'happy';
      else if (/为什么|怎么|？|思考|想想|考虑|计划|安排|分析/.test(text)) mood = 'thinking';
      else if (/生气|烦|讨厌|滚|闭嘴|无语|无奈|唉|哎|算了|随便/.test(text)) mood = 'angry';
      
      // 情绪变化或已有3条时切页
      if (currentPageDialogues.length >= 3 || (lastMood && mood !== lastMood && currentPageDialogues.length >= 2)) {
        newPages.push(createPageWithSettings(currentPageDialogues, lastMood));
        currentPageDialogues = [];
      }
      currentPageDialogues.push(i);
      lastMood = mood;
    }
    if (currentPageDialogues.length > 0) {
      newPages.push(createPageWithSettings(currentPageDialogues, lastMood));
    }
    
    pages = newPages;
    currentPageIndex = 0;
    renderPageManager();
    renderPageNav();
    showPage(0);
    
    alert(`AI 辅助完成！\n\n已自动分为 ${pages.length} 页，并为每页设定了画面风格。\n你可以点击每页展开查看和修改，然后点击生成。`);
    
  } catch (error) {
    alert(`AI 辅助失败：${error.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 AI 辅助切页和设定画面';
  }
}

function createPageWithSettings(dialogueIds, mood) {
  let scene = '';
  let actionA = '';
  let actionB = '';
  let extra = '';
  
  // 根据所有对话内容判断场景
  const allText = dialogueIds.map(id => allDialogues[id].text).join('');
  if (/火锅|吃|饭|餐厅|美食/.test(allText)) { scene = '火锅店或餐厅'; extra = '桌上有火锅和美食'; }
  else if (/咖啡|咖啡馆|下午茶/.test(allText)) { scene = '咖啡馆'; extra = '桌上有咖啡杯'; }
  else if (/公司|上班|工作|办公室|会议/.test(allText)) { scene = '办公室'; }
  else if (/家|家里|客厅|沙发|电视/.test(allText)) { scene = '家里客厅'; extra = '有沙发和茶几'; }
  else if (/公园|户外|散步|天气|花/.test(allText)) { scene = '户外公园'; }
  
  // 根据情绪设定表情动作
  if (mood === 'happy') {
    actionA = '微笑或开心';
    actionB = '兴奋或手舞足蹈';
  } else if (mood === 'thinking') {
    actionA = '托腮思考或扶眼镜';
    actionB = '认真倾听或歪头思考';
  } else if (mood === 'angry') {
    actionA = '无奈扶额或皱眉';
    actionB = '委屈或生气';
  }
  
  return {
    id: Date.now() + Math.random(),
    dialogueIds: [...dialogueIds],
    style: { scene, actionA, actionB, extra },
    characterImageUrl: null,
    generated: false,
    generating: false,
    progress: 0,
    progressText: ''
  };
}

// ============ 保存与历史记录 ============
function getHistory() {
  try {
    const data = localStorage.getItem(HISTORY_STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) { return []; }
}

function saveHistory(history) {
  localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
}

function saveCurrentSettings() {
  let name = '';
  if (allDialogues.length > 0) {
    name = allDialogues.slice(0, 2).map(d => d.text).join(' / ');
    if (name.length > 40) name = name.substring(0, 40) + '...';
  }
  if (!name) name = '未命名对话';
  
  const finalName = prompt('给这条记录起个名字：', name);
  if (finalName === null) return;
  
  const record = {
    id: Date.now().toString(),
    name: finalName || name,
    createdAt: new Date().toLocaleString('zh-CN'),
    selectedA, selectedB,
    allDialogues: JSON.parse(JSON.stringify(allDialogues)),
    globalOverall: document.getElementById('globalOverall').value,
    globalScene: document.getElementById('globalScene').value,
    pages: JSON.parse(JSON.stringify(pages.map(p => ({ ...p, characterImageUrl: null, generated: false, generating: false }))))
  };
  
  const history = getHistory();
  history.unshift(record);
  if (history.length > 50) history.length = 50;
  saveHistory(history);
  renderHistoryList();
  alert('保存成功！');
}

function loadHistoryItem(id) {
  const history = getHistory();
  const record = history.find(r => r.id === id);
  if (!record) { alert('记录不存在'); return; }
  
  selectedA = record.selectedA;
  selectedB = record.selectedB;
  allDialogues = JSON.parse(JSON.stringify(record.allDialogues));
  document.getElementById('globalOverall').value = record.globalOverall || '';
  document.getElementById('globalScene').value = record.globalScene || '';
  pages = JSON.parse(JSON.stringify(record.pages || []));
  if (pages.length === 0) createDefaultPages();
  currentPageIndex = 0;
  
  initMbtiGrid('mbtiGridA', selectedA, selectA);
  initMbtiGrid('mbtiGridB', selectedB, selectB);
  renderDialogues();
  renderPageManager();
  renderPageNav();
  showPage(0);
  
  alert(`已加载记录：${record.name}`);
}

function deleteHistoryItem(id) {
  if (!confirm('确定要删除这条记录吗？')) return;
  const history = getHistory().filter(r => r.id !== id);
  saveHistory(history);
  renderHistoryList();
}

function renderHistoryList() {
  const container = document.getElementById('historyList');
  const history = getHistory();
  if (history.length === 0) {
    container.innerHTML = '<p class="hint" style="text-align:center;margin:10px 0;">暂无保存的记录</p>';
    return;
  }
  container.innerHTML = history.map(record => `
    <div class="history-item">
      <div class="history-info" onclick="loadHistoryItem('${record.id}')">
        <div class="history-name">${escapeHtml(record.name)}</div>
        <div class="history-meta">${record.createdAt} · ${record.selectedA.toUpperCase()} × ${record.selectedB.toUpperCase()} · ${record.allDialogues.length}条对话</div>
      </div>
      <div class="history-actions">
        <button class="history-load-btn" onclick="loadHistoryItem('${record.id}')">加载</button>
        <button class="history-delete-btn" onclick="deleteHistoryItem('${record.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============ 清除所有设置 ============
function clearAllSettings() {
  if (!confirm('确定要清除所有设置吗？（对话内容、页面设置、风格设定都会被清空）')) return;
  allDialogues = [{ speaker: 'a', text: '' }, { speaker: 'b', text: '' }];
  document.getElementById('globalOverall').value = '';
  document.getElementById('globalScene').value = '';
  createDefaultPages();
  currentPageIndex = 0;
  characterImages = {};
  renderDialogues();
  renderPageManager();
  renderPageNav();
  showPage(0);
}

// ============ 初始化 ============
initMbtiGrid('mbtiGridA', selectedA, selectA);
initMbtiGrid('mbtiGridB', selectedB, selectB);
renderDialogues();
createDefaultPages();
renderPageManager();
renderPageNav();
showApiKeyBanner();
renderHistoryList();
</script>
